<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - StudyHive</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="auth-page">

        <div class="auth-card">

            <a href="index.html" class="auth-logo">StudyHive</a>

            <h1>Welcome Back</h1>

            <p class="auth-subtitle">
                Login to continue your learning journey.
            </p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <div class="form-options">
                    <label>
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">Forgot Password?</a>
                </div>

                <button type="submit" class="auth-btn">
                    Login
                </button>

                <p id="loginMessage"></p>

            </form>

            <p class="auth-footer">
                Don't have an account?
                <a href="register.html">Create Account</a>
            </p>

        </div>

    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", async function(event) {

            event.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const message = document.getElementById("loginMessage");

            message.innerText = "Logging in...";
            message.style.color = "blue";

            try {

                const response = await fetch("/api/login",  {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                const data = await response.json();

                if (response.ok) {

                    message.innerText = data.message || "Login successful!";
                    message.style.color = "green";

                    // Save login information
                    localStorage.setItem("studyhiveUser", JSON.stringify(data.user));

                    // Open dashboard
                    setTimeout(function() {
                        window.location.href = "dashboard.html";
                    }, 1000);

                } else {

                    message.innerText = data.message || "Invalid email or password";
                    message.style.color = "red";

                }

            } catch (error) {

                message.innerText = "Backend server is not running!";
                message.style.color = "red";

                console.error(error);
            }

        });
    </script>

</body>
</html>
